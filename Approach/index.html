
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Approach | Burton Business Solutions</title>
  <link rel="stylesheet" href="/assets/css/styles.css" />

  <style>
    /* Mobile navigation */
    .mobile-menu-button {
      display: none;
      background: transparent;
      color: inherit;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 22px;
      cursor: pointer;
    }

    /* Approach page */
    .approach-page {
      padding-top: 35px;
      padding-bottom: 45px;
    }

    .approach-heading {
      margin-bottom: 22px;
    }

    .approach-heading h1 {
      margin-bottom: 8px;
    }

    .approach-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .approach-card {
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
      width: 100%;
      min-width: 0;
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card, #fff);
      transition: border-color .2s, box-shadow .2s;
    }

    .approach-card .step-number {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .approach-card h2 {
      font-size: 18px;
      margin: 0 0 10px;
    }

    .approach-card p {
      font-size: 14px;
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .approach-card.active {
      border: 2px solid #2563eb;
      box-shadow: 0 0 0 2px rgba(37,99,235,.08);
    }

    .approach-card:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 3px;
    }

    .approach-details {
      margin-top: 22px;
      padding: 25px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--card, #fff);
    }

    .approach-details h2 {
      margin: 0 0 12px;
    }

    .approach-details p {
      line-height: 1.65;
    }

    .approach-details li {
      margin-bottom: 9px;
      line-height: 1.5;
    }

    .approach-details .btn {
      display: inline-block;
      margin-top: 12px;
      text-decoration: none;
    }

    @media (max-width: 768px) {
      .nav-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
      }

      .mobile-menu-button {
        display: block;
      }

      .nav-links {
        display: none;
        flex-direction: column;
        align-items: stretch;
        width: 100%;
        padding: 16px 0;
        gap: 12px;
      }

      .nav-links.open {
        display: flex;
      }

      .nav-links a {
        display: block;
        padding: 10px 12px;
      }

      .approach-page {
        padding-top: 24px;
      }

      .approach-grid {
        gap: 8px;
      }

      .approach-card {
        padding: 12px;
      }

      .approach-card h2 {
        font-size: 15px;
      }

      .approach-card p {
        font-size: 12px;
      }

      .approach-details {
        padding: 18px;
      }
    }

    @media (max-width: 380px) {
      .approach-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <!-- NAVIGATION -->
  <header class="nav">
    <div class="container nav-inner">
      <a class="brand" href="/">
        <div class="name">Burton Business Solutions</div>
        <div class="tag">Operational Systems Consulting</div>
      </a>

      <button
        class="mobile-menu-button"
        type="button"
        id="menuButton"
        aria-label="Toggle navigation"
        aria-controls="mainNavigation"
        aria-expanded="false"
      >☰</button>

      <nav class="nav-links" id="mainNavigation" aria-label="Main navigation">
        <a href="/">Home</a>
        <a href="/services/">Services</a>
        <a href="/approach/">Approach</a>
        <a href="/about/">About</a>
        <a class="btn btn-primary" href="/get-started/">Contact Us</a>
      </nav>
    </div>
  </header>

  <!-- APPROACH -->
  <main class="container approach-page">

    <div class="approach-heading">
      <h1>Our Approach</h1>
      <p>
        A practical, three-step process built around your business.
        Select a step to learn more.
      </p>
    </div>

    <!-- SELECTABLE STEPS -->
    <div class="approach-grid">

      <button
        class="approach-card active"
        type="button"
        data-step="assess"
        aria-pressed="true"
      >
        <span class="step-number">01</span>
        <h2>Assess</h2>
        <p>Understand your business and identify opportunities.</p>
      </button>

      <button
        class="approach-card"
        type="button"
        data-step="architect"
        aria-pressed="false"
      >
        <span class="step-number">02</span>
        <h2>Architect</h2>
        <p>Design a solution that fits your business.</p>
      </button>

      <button
        class="approach-card"
        type="button"
        data-step="execute"
        aria-pressed="false"
      >
        <span class="step-number">03</span>
        <h2>Execute &amp; Refine</h2>
        <p>Implement, test, and improve.</p>
      </button>

    </div>

    <!-- DYNAMIC DETAILS -->
    <section class="approach-details" aria-live="polite">
      <h2 id="detailTitle">Assess</h2>
      <p id="detailDescription"></p>

      <h3>What This Involves</h3>
      <ul id="detailExamples"></ul>

      <a class="btn btn-primary" href="/get-started/">
        Contact Us
      </a>
    </section>

  </main>

  <!-- FOOTER -->
  <div class="footer">
    © <span id="year"></span> Burton Business Solutions. All rights reserved.
  </div>

  <script>
    document.getElementById("year").textContent =
      new Date().getFullYear();

    // Mobile navigation
    const menuButton = document.getElementById("menuButton");
    const mainNavigation = document.getElementById("mainNavigation");

    menuButton.addEventListener("click", function () {
      const isOpen = mainNavigation.classList.toggle("open");
      menuButton.setAttribute("aria-expanded", String(isOpen));
      menuButton.textContent = isOpen ? "✕" : "☰";
    });

    // Approach details
    const steps = {
      assess: {
        title: "Assess",
        description:
          "We start by learning how your business operates today. We look at your existing systems, workflows, and challenges to understand what's working and where improvements could make the biggest difference.",
        examples: [
          "Discuss your business goals and operational challenges",
          "Review existing software and workflows",
          "Identify repetitive tasks, bottlenecks, and inefficiencies",
          "Prioritize opportunities based on business impact"
        ]
      },

      architect: {
        title: "Architect",
        description:
          "Once we understand your needs, we develop a practical plan. Our focus is on making the most of your existing technology before recommending additional tools or investments.",
        examples: [
          "Evaluate available solutions and integration options",
          "Design improved workflows and automations",
          "Recommend cost-effective technology",
          "Define an implementation plan and expected outcomes"
        ]
      },

      execute: {
        title: "Execute & Refine",
        description:
          "We put the plan into action, validate that everything works as intended, and make adjustments based on real-world use. We also help your team understand and use the solution.",
        examples: [
          "Configure systems and build automations",
          "Test solutions before deployment",
          "Provide guidance and training",
          "Monitor results and refine as needed"
        ]
      }
    };

    const cards = document.querySelectorAll(".approach-card");
    const detailTitle = document.getElementById("detailTitle");
    const detailDescription =
      document.getElementById("detailDescription");
    const detailExamples =
      document.getElementById("detailExamples");

    function selectStep(stepKey) {
      const step = steps[stepKey];

      if (!step) return;

      cards.forEach(function (card) {
        const isSelected = card.dataset.step === stepKey;
        card.classList.toggle("active", isSelected);
        card.setAttribute("aria-pressed", String(isSelected));
      });

      detailTitle.textContent = step.title;
      detailDescription.textContent = step.description;

      detailExamples.replaceChildren();

      step.examples.forEach(function (example) {
        const item = document.createElement("li");
        item.textContent = example;
        detailExamples.appendChild(item);
      });
    }

    cards.forEach(function (card) {
      card.addEventListener("click", function () {
        selectStep(card.dataset.step);
      });
    });

    // Default selected step
    selectStep("assess");
  </script>

</body>
</html>
